name: validate

on:
  pull_request:
    paths:
      - gitops/root/**
      - .github/workflows/validate.yaml
  push:
    branches:
      - main
    paths:
      - gitops/root/**
      - .github/workflows/validate.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render exact reviewed root
        shell: bash
        run: |
          set -euo pipefail
          kubectl_url=https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          kubectl_sha=6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          curl --fail --silent --show-error --location "$kubectl_url" --output "$RUNNER_TEMP/kubectl"
          printf '%s  %s\n' "$kubectl_sha" "$RUNNER_TEMP/kubectl" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/kubectl"
          test "$(sha256sum gitops/root/argocd/install.yaml | cut -d' ' -f1)" = 9a87f2b3e14c278f12501eb0ef5c3955b27cf05370ca425381c6a908cf85a5c5
          "$RUNNER_TEMP/kubectl" kustomize gitops/root > "$RUNNER_TEMP/root.yaml"
          test "$(sha256sum "$RUNNER_TEMP/root.yaml" | cut -d' ' -f1)" = 8e0ec1bf59d95bb26cf1038c41abb00805be093ca26c5c1eb463bbb6959eb533
          test "$(python -c 'import json; x=json.load(open("gitops/root/inventory.json")); print(x["resourceCount"] if len(x["resources"]) == x["resourceCount"] else "invalid")')" = 181
          sops_url=https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sops_sha=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          curl --fail --silent --show-error --location "$sops_url" --output "$RUNNER_TEMP/sops"
          printf '%s  %s\n' "$sops_sha" "$RUNNER_TEMP/sops" | sha256sum --check --strict
          chmod 0700 "$RUNNER_TEMP/sops"
          test "$("$RUNNER_TEMP/sops" filestatus gitops/root/platform/sops-diagnostics/grafana-admin.enc.yaml)" = '{"encrypted":true}'
          test "$("$RUNNER_TEMP/sops" filestatus gitops/root/platform/sops-diagnostics/sops-canary.enc.yaml)" = '{"encrypted":true}'
          git diff --check
