apiVersion: v1
kind: ConfigMap
metadata:
  name: playbox-loki-datasource
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/tracking-id: playbox-root:/ConfigMap:monitoring/playbox-loki-datasource
  labels:
    app.kubernetes.io/part-of: playbox-platform
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: playbox-loki
        type: loki
        access: proxy
        url: http://playbox-loki.security-observability.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
