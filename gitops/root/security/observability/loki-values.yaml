deploymentMode: SingleBinary
defaults:
  automountServiceAccountToken: false
rbac:
  namespaced: true
serviceAccount:
  automountServiceAccountToken: false
sidecar:
  rules:
    enabled: false
memberlist:
  service:
    publishNotReadyAddresses: true
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 168h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: false
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false
singleBinary:
  replicas: 1
  sidecar: false
  persistence:
    enabled: true
    storageClass: playbox-ceph-block
    size: 20Gi
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  service:
    type: ClusterIP
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
memcached:
  enabled: false
  serviceAccount:
    create: false
memcachedExporter:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: playbox-monitoring
