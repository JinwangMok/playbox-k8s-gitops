apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playbox-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JinwangMok/playbox-k8s-gitops.git
    targetRevision: main
    path: gitops/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
