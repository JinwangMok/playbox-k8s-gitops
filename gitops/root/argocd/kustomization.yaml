apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - install.yaml
  - root-application.yaml
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
        annotations:
          argocd.argoproj.io/sync-wave: "-10"
      data:
        resource.customizations.health.ceph.rook.io_CephCluster: |
          hs = {status = "Progressing", message = "Ceph cluster is reconciling"}
          if obj.status ~= nil then
            if obj.status.phase == "Ready" and obj.status.ceph ~= nil and obj.status.ceph.health == "HEALTH_OK" then
              hs.status = "Healthy"
              hs.message = "Ceph cluster is Ready and HEALTH_OK"
            elseif obj.status.phase == "Failure" then
              hs.status = "Degraded"
              hs.message = obj.status.message or "Ceph cluster reconciliation failed"
            end
          end
          return hs
        resource.customizations.health.ceph.rook.io_CephBlockPool: |
          hs = {status = "Progressing", message = "Ceph block pool is reconciling"}
          if obj.status ~= nil and obj.status.conditions ~= nil then
            for _, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message or "Ceph block pool is Ready"
                return hs
              end
              if condition.type == "Ready" and condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message or "Ceph block pool is not Ready"
              end
            end
          end
          return hs
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: applications.argoproj.io
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1tracking-id
        value: playbox-root:apiextensions.k8s.io/CustomResourceDefinition:argocd/applications.argoproj.io
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: applicationsets.argoproj.io
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1tracking-id
        value: playbox-root:apiextensions.k8s.io/CustomResourceDefinition:argocd/applicationsets.argoproj.io
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: appprojects.argoproj.io
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1tracking-id
        value: playbox-root:apiextensions.k8s.io/CustomResourceDefinition:argocd/appprojects.argoproj.io
